;
; gruvw theme for Albert v34 (Widgets BoxModel)
; Port of gruvw.qss by gruvw <https://github.com/gruvw>
;
; Install: ~/.local/share/albert/widgetsboxmodel/themes/gruvw.ini
; !!!!!!!!!!!! copy the file itself; symlinks are ignored !!!!!!!!!!!!
;

; Variables
bg=#1F1F1F
fg=#F4F4F4
selection=#292929
accent=#69FC9A
muted=#8A8A8A

[palette]
base=$bg
text=$fg
window=$bg
window_text=$fg
button=$bg
button_text=$fg
; highlight is also the text-selection color in the input line
highlight=$selection
highlight_text=$accent
placeholder_text=$muted
link=$accent
link_visited=$accent

[window]
; 2px white frame around the window (the width is set in the config, see below)
window_border_brush=$fg
window_background_brush=$bg

; Flat input line with no border
input_background_brush=$bg
input_border_brush=transparent
input_trigger_color=$accent
input_hint_color=$muted

; Hide the settings button (it was max-width: 0 in the QSS)
settings_button_color=transparent
settings_button_highlight_color=transparent

; Results: #292929 selection with green text, no selection border
result_item_selection_background_brush=$selection
result_item_selection_border_brush=transparent
result_item_selection_text_color=$accent
result_item_selection_subtext_color=$muted
result_item_text_color=$fg
result_item_subtext_color=$muted

; Actions: same style as the results
action_item_selection_background_brush=$selection
action_item_selection_border_brush=transparent
action_item_selection_text_color=$accent
action_item_text_color=$fg

; Uncomment to remove the drop shadow
;window_shadow_brush=transparent
